name: CI/CD Quality & Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Permissões mínimas para segurança (Least Privilege Principle)
permissions:
  contents: read

# Evita execuções redundantes cancelando builds em andamento na mesma branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: 🎨 Linter & Code Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff (Syntax & Critical Checks)
        run: |
          ruff check --select E9,F63,F7,F82 src/ tests/

  security-sast:
    name: 🛡️ SAST Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit (Security Vulnerability Scanner)
        run: |
          bandit -r src/ -ll

  test-matrix:
    name: 🧪 Tests & Coverage (Python ${{ matrix.python-version }})
    needs: [code-quality, security-sast]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run Automated Test Suite with Coverage
        run: |
          coverage run -m unittest discover tests
          coverage report -m

      - name: Generate GitHub Step Summary
        if: always()
        run: |
          echo "### 📊 Resumo de Execução dos Testes (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo "✅ Todos os testes automatizados foram executados com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ambiente** | Ubuntu Latest |" >> $GITHUB_STEP_SUMMARY
          echo "| **Versão Python** | ${{ matrix.python-version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Suíte de Testes** | \`tests/\` (18 testes) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Segurança SAST** | Aprovado (Bandit 0 vulnerabilidades) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Qualidade** | Aprovado (Ruff checks) |" >> $GITHUB_STEP_SUMMARY
